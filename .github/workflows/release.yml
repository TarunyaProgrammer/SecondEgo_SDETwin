name: Release SecondEgo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    env:
      RELEASE_SIGNING_ENABLED: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' && 'true' || 'false' }}
      RELEASE_NOTARIZATION_ENABLED: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && 'true' || 'false' }}
    strategy:
      matrix:
        include:
          - runner: macos-14
            rust_target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-13
            rust_target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Build Rust gateway
        working-directory: engine-rs
        run: cargo build --release --locked -p secondego-gateway --target ${{ matrix.rust_target }}
      - name: Stage gateway for Electron
        shell: bash
        run: |
          mkdir -p apps/desktop/resources
          cp "engine-rs/target/${{ matrix.rust_target }}/release/secondego-gateway" apps/desktop/resources/secondego-gateway
          chmod 755 apps/desktop/resources/secondego-gateway
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build desktop renderer and stage release resources
        working-directory: apps/desktop
        run: |
          npm run build
          npm run prepare-release
        env:
          SECONDEGO_GATEWAY_SOURCE: ${{ github.workspace }}/engine-rs/target/${{ matrix.rust_target }}/release/secondego-gateway
      - name: Build signed DMG (notarizes when Apple credentials are present)
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        working-directory: apps/desktop
        run: npx --yes electron-builder@25.1.8 --mac dmg --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build unsigned DMG candidate
        if: env.RELEASE_SIGNING_ENABLED != 'true'
        working-directory: apps/desktop
        run: npx --yes electron-builder@25.1.8 --mac dmg --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Generate checksums and release manifest
        working-directory: apps/desktop
        run: npm run release-manifest
        env:
          RELEASE_SIGNED: ${{ env.RELEASE_SIGNING_ENABLED }}
          RELEASE_NOTARIZED: ${{ env.RELEASE_NOTARIZATION_ENABLED }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: secondego-macos-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/release-manifest.json
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.dmg
            apps/desktop/release/SHA256SUMS.txt
            apps/desktop/release/release-manifest.json
