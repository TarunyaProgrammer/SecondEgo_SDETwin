name: Verify SecondEgo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test locked workspace
        working-directory: engine-rs
        run: cargo test --locked --workspace

  web:
    name: Marketing website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Build production website
        working-directory: web
        run: npm run build
      - name: Verify social preview generation
        working-directory: web
        run: npm run generate:og

  desktop:
    name: Desktop renderer and process checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build desktop renderer
        working-directory: apps/desktop
        run: npm run build
      - name: Validate Electron process scripts
        working-directory: apps/desktop
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/credential-store.cjs
          node --check electron/launch.cjs
          node --check scripts/prepare-release.cjs
          node --check scripts/write-release-manifest.cjs
      - name: Validate platform gateway resources
        working-directory: apps/desktop
        run: |
          ruby -e '
            require "yaml"
            config = YAML.load_file("electron-builder.yml")
            expected = {
              "mac" => ["resources/secondego-gateway", "resources/SecondEgoCredentialHelper"],
              "win" => ["resources/secondego-gateway.exe"],
              "linux" => ["resources/secondego-gateway"]
            }
            expected.each do |platform, paths|
              configured = Array(config.fetch(platform).fetch("extraResources")).map { |item| item.fetch("from") }
              missing = paths - configured
              abort "#{platform} is missing #{missing.join(", ")}" unless missing.empty?
            end
            puts "platform gateway resources ok"
          '
