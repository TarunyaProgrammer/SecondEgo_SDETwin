[package]
name = "secondego-core"
version = "0.1.0"
edition = "2024"
description = "Rust execution contracts for the SecondEgo coding harness"
license = "MIT"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
