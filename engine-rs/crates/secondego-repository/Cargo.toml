[package]
name = "secondego-repository"
version = "0.1.0"
edition = "2024"
description = "Bounded Tree-sitter repository indexing for SecondEgo"
license = "MIT"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
tree-sitter = "0.25"
tree-sitter-python = "0.25"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
