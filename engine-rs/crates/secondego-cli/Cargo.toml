[package]
name = "secondego-cli"
version = "0.1.0"
edition = "2024"
description = "Evaluator-facing Rust CLI for SecondEgo"
license = "MIT"

[dependencies]
libc = "0.2"
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
secondego-core = { path = "../secondego-core" }
secondego-model = { path = "../secondego-model" }
secondego-runtime = { path = "../secondego-runtime" }
secondego-storage = { path = "../secondego-storage" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
