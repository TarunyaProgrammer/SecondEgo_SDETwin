[project]
name = "secondego"
version = "0.1.0"
description = "Autonomous coding-agent harness"
requires-python = ">=3.12"

[project.scripts]
secondego = "SecondEgo.cli:main"
secondego-tui = "SecondEgo.tui:main"
secondego-desktop = "SecondEgo.desktop.gateway:main"
secondego-gestures = "SecondEgo.gesture.watcher:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gemini = ["google-genai>=1.0"]
gesture = ["opencv-python>=4.9", "mediapipe>=0.10,<1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"SecondEgo.desktop" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
